name: coordinate_system_identifier
description: "Identify coordinate system of some coordinates."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  coordinate_systems_data:
    path: packages/coordinate_systems_data
  provider: ^6.1.2
  proj4dart: ^2.1.0
  separate: ^1.0.3
  freezed_annotation: ^2.4.4
  logger: ^2.4.0
  google_maps_flutter: ^2.9.0
  collection: ^1.18.0
  url_launcher: ^6.3.1
  pointer_interceptor: ^0.10.1+2
  maps_toolkit: ^3.0.0
  latlong_formatter: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.7
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/coordinate_systems.json

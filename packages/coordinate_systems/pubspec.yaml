name: coordinate_systems
description: Coordinate system definitions derived from epsg's database.
version: 1.0.0
repository: https://github.com/martinsellergren/coordinate_system_identifier/tree/main/packages/coordinate_systems
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  coordinate_systems_model:
    path: ../coordinate_systems_model
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  proj4dart: ^2.1.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  test: ^1.24.0

flutter:
  assets:
    - assets/coordinate_systems.json
